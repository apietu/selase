<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="personGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="200" fill="url(#bgGradient)"/>
  
  <!-- Decorative Elements -->
  <circle cx="80" cy="120" r="3" fill="rgba(255,255,255,0.3)">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="100" r="2" fill="rgba(255,255,255,0.4)">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="280" r="4" fill="rgba(255,255,255,0.2)">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Code-like decorative elements -->
  <rect x="60" y="300" width="15" height="3" rx="1.5" fill="rgba(255,255,255,0.3)"/>
  <rect x="80" y="300" width="25" height="3" rx="1.5" fill="rgba(255,255,255,0.2)"/>
  <rect x="110" y="300" width="10" height="3" rx="1.5" fill="rgba(255,255,255,0.3)"/>
  
  <!-- Person Silhouette -->
  <g transform="translate(200, 200)">
    <!-- Head -->
    <circle cx="0" cy="-40" r="35" fill="url(#personGradient)"/>
    
    <!-- Body -->
    <path d="M -45 20 Q -45 -10 -25 -15 Q 0 -20 25 -15 Q 45 -10 45 20 L 45 80 Q 45 90 35 90 L -35 90 Q -45 90 -45 80 Z" fill="url(#personGradient)"/>
    
    <!-- Arms -->
    <ellipse cx="-55" cy="10" rx="12" ry="35" fill="url(#personGradient)" transform="rotate(-15)"/>
    <ellipse cx="55" cy="10" rx="12" ry="35" fill="url(#personGradient)" transform="rotate(15)"/>
  </g>
  
  <!-- Tech-related icons around the person -->
  <g fill="rgba(255,255,255,0.4)" font-family="Arial" font-size="20">
    <!-- HTML tag -->
    <text x="100" y="180" font-family="monospace">&lt;/&gt;</text>
    
    <!-- Python symbol -->
    <circle cx="290" cy="180" r="8" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <text x="285" y="185" font-size="10" fill="rgba(255,255,255,0.6)">Py</text>
    
    <!-- Gear icon -->
    <g transform="translate(130, 320)">
      <circle cx="0" cy="0" r="8" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
      <circle cx="0" cy="0" r="3" fill="rgba(255,255,255,0.4)"/>
      <line x1="-6" y1="0" x2="6" y2="0" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
      <line x1="0" y1="-6" x2="0" y2="6" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    </g>
    
    <!-- Database icon -->
    <g transform="translate(270, 320)">
      <ellipse cx="0" cy="-5" rx="8" ry="3" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="8" ry="3" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
      <ellipse cx="0" cy="5" rx="8" ry="3" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
      <line x1="-8" y1="-5" x2="-8" y2="5" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
      <line x1="8" y1="-5" x2="8" y2="5" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Floating particles -->
  <circle cx="150" cy="80" r="1.5" fill="rgba(251,191,36,0.6)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 10,-10; 0,0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="90" r="1" fill="rgba(251,191,36,0.4)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -8,8; 0,0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="250" r="2" fill="rgba(255,255,255,0.5)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 5,15; 0,0" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
